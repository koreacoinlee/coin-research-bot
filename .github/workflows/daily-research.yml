name: daily-research

on:
  schedule:
    - cron: "10 */4 * * *"  # 4시간봉 마감 10분 뒤마다 (한국시간 01·05·09·13·17·21시 10분) 
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 핵심 규칙 자동 점검. 실패하면 이번 회차 연구를 건너뛰고(결과 파일을 건드리지 않음) 실패로 표시한다.
      - name: Self-test
        run: python -m tests.test_core

      - name: Research
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.research

      - name: Save results to repo
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add results data
          git commit -m "research: $(TZ=Asia/Seoul date '+%F %H:%M')" || echo "no changes"
          git pull --rebase -X theirs origin main || true
          git push
