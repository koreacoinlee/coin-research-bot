name: daily-research

on:
  schedule:
    - cron: "15 0 * * *"   # 매일 09:15 (한국시간) = 00:15 UTC
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Research
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.research

      - name: Save results to repo
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add results data
          git commit -m "research: $(TZ=Asia/Seoul date +%F)" || echo "no changes"
          git push
